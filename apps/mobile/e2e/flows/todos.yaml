# Quick-add a todo, complete it, find it under Done.
appId: com.stageholder.meridian
name: todos
---
- runFlow: ../subflows/launch-signed-in.yaml
- evalScript: ${output.todo = 'JEVB E2E Todo ' + String(Date.now()).slice(-8)}
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB_LABEL: "Todos"
      TAB_ID: "tab-todos"
- tapOn:
    id: "fab-new-todo"
- extendedWaitUntil:
    visible:
      id: "quick-add-todo-title"
    timeout: 20000
- waitForAnimationToEnd
# The title is a rich-text (WebView) field — tap it so it owns the keyboard.
- tapOn:
    id: "quick-add-todo-title"
- inputText: ${output.todo}
- waitForAnimationToEnd
# The WebView editor commits keystrokes asynchronously — on a loaded emulator
# `inputText` returns while characters are still arriving ("JEVB E2E To"), so
# wait for the full title to be in the field before creating.
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 10000
- tapOn: "Create New Todo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 15000
# Complete via swipe-right. The row's first left action is `autoCommit`. Kit
# < 0.4.0-alpha.2 mapped ReanimatedSwipeable's direction to the wrong panel
# (RNGH 2.28–2.31), so a full swipe only REVEALED the green "Done" panel
# (observed 2026-10-18); alpha.2 fixed the mapping. Keep accepting both
# outcomes: if the panel is still open, tap its button. "Done" index 0 is the
# segmented-control filter; the panel's button is the second "Done" on screen.
- swipe:
    from:
      text: ${output.todo}
    direction: RIGHT
    duration: 1000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Done"
        index: 1
    commands:
      - tapOn:
          text: "Done"
          index: 1
      - waitForAnimationToEnd
# Done filter shows it (the native segmented control)
- tapOn:
    text: "Done"
    index: 0
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 10000
- tapOn:
    text: "All"
    index: 0
