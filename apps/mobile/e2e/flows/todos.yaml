# Quick-add a todo, complete it, find it under Done.
appId: com.stageholder.meridian
name: todos
---
- runFlow: ../subflows/launch-signed-in.yaml
- evalScript: ${output.todo = 'JEVB E2E Todo ' + String(Date.now()).slice(-8)}
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB_LABEL: "Todos"
      TAB_ID: "tab-todos"
- tapOn:
    id: "fab-new-todo"
- extendedWaitUntil:
    visible:
      id: "quick-add-todo-title"
    timeout: 20000
- waitForAnimationToEnd
# The title is a rich-text (WebView) field — tap it so it owns the keyboard.
- tapOn:
    id: "quick-add-todo-title"
- inputText: ${output.todo}
- waitForAnimationToEnd
- tapOn: "Create New Todo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 15000
# Complete via a long swipe-right (the row's auto-committing quick action)
- swipe:
    from:
      text: ${output.todo}
    direction: RIGHT
    duration: 600
# Done filter shows it (the native segmented control)
- tapOn:
    text: "Done"
    index: 0
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 10000
- tapOn:
    text: "All"
    index: 0
