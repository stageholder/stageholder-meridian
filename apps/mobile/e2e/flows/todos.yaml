# Quick-add a todo, open its detail, create a second one from a CLEAN
# composer, delete the right one, complete the first, find it under Done.
appId: com.stageholder.meridian
name: todos
---
- runFlow: ../subflows/launch-signed-in.yaml
- evalScript: ${output.todo = 'JEVB E2E Todo ' + String(Date.now()).slice(-8)}
- evalScript: ${output.todo2 = 'JEVB E2E Second ' + String(Date.now()).slice(-8)}
# Alert titles are regexes: escape the trailing "?".
- evalScript: ${output.del2 = 'Delete "' + output.todo2 + '"\\?'}
- evalScript: ${output.del1 = 'Delete "' + output.todo + '"\\?'}
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB_LABEL: "Todos"
      TAB_ID: "tab-todos"
- tapOn:
    id: "fab-new-todo"
- extendedWaitUntil:
    visible:
      id: "quick-add-todo-title"
    timeout: 20000
- waitForAnimationToEnd
# Tap the title so it owns the keyboard (the sheet focuses it on settle; the
# tap makes the flow independent of that timing).
- tapOn:
    id: "quick-add-todo-title"
- inputText: ${output.todo}
- waitForAnimationToEnd
# On a loaded emulator `inputText` can return while characters are still
# arriving, so wait for the full title to be in the field before creating.
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 10000
- tapOn: "Create New Todo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 15000
# Tapping the row opens the DETAIL sheet (per-field instant commit, no Save):
# the status circle + bare title on top, the attribute pills, then the ghost
# notes field. Close it by tapping the dimmed overlay above the sheet.
- tapOn: ${output.todo}
- extendedWaitUntil:
    visible: "Add notes…"
    timeout: 10000
- assertVisible: "Priority|Low|Medium|High|Urgent"
# Close via the sheet's handle. A tap that lands while the sheet is still
# settling is swallowed (nothing sticks — the next tap closes), so retry once.
- waitForAnimationToEnd
- tapOn: "Close"
- runFlow:
    when:
      visible: "Add notes…"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Add notes…"
    timeout: 8000
# SECOND todo from the FAB: the composer must come back EMPTY (regression
# 2026-10-25: the sheet kept its first instance, so the previous title was
# still in the field). The placeholder only shows while the field is empty.
- tapOn:
    id: "fab-new-todo"
- extendedWaitUntil:
    visible:
      id: "quick-add-todo-title"
    timeout: 20000
- waitForAnimationToEnd
- assertVisible: "What needs to be done?"
- tapOn:
    id: "quick-add-todo-title"
- inputText: ${output.todo2}
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.todo2}
    timeout: 10000
- tapOn: "Create New Todo"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: ${output.todo2}
    timeout: 15000
# Open the SECOND todo's detail and delete it through "⋯": the confirm alert
# must name THIS todo (regression 2026-10-25: the detail sheet opened on todo
# B with todo A's title still in its field and autosaved it over B, so the
# delete alert — and the list — showed the wrong todo).
- tapOn: ${output.todo2}
- extendedWaitUntil:
    visible: "Add notes…"
    timeout: 10000
# Taps during the open slide are swallowed (nothing sticks — the next tap
# works), so let it land first and retry once if the menu did not open.
- waitForAnimationToEnd
- tapOn: "More actions"
- runFlow:
    when:
      notVisible: "Delete todo"
    commands:
      - waitForAnimationToEnd
      - tapOn: "More actions"
- extendedWaitUntil:
    visible: "Delete todo"
    timeout: 5000
- tapOn: "Delete todo"
- extendedWaitUntil:
    visible: ${output.del2}
    timeout: 5000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible: ${output.todo2}
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Add notes…"
    timeout: 8000
# Long-press menu (web right-click parity): Do-date presets, Edit, Done,
# Duplicate, Delete. Move the first todo to Tomorrow, then open Delete and
# cancel — the alert must name THIS todo.
- longPressOn: ${output.todo}
- extendedWaitUntil:
    visible: "Duplicate"
    timeout: 8000
- tapOn: "Tomorrow"
- extendedWaitUntil:
    notVisible: "Duplicate"
    timeout: 8000
- waitForAnimationToEnd
- longPressOn: ${output.todo}
- extendedWaitUntil:
    visible: "Duplicate"
    timeout: 8000
- tapOn: "Delete"
- extendedWaitUntil:
    visible: ${output.del1}
    timeout: 5000
- tapOn: "Cancel"
- waitForAnimationToEnd
# And the FIRST todo's detail still names the first todo.
- tapOn: ${output.todo}
- extendedWaitUntil:
    visible: "Add notes…"
    timeout: 10000
# Taps during the open slide are swallowed (nothing sticks — the next tap
# works), so let it land first and retry once if the menu did not open.
- waitForAnimationToEnd
- tapOn: "More actions"
- runFlow:
    when:
      notVisible: "Delete todo"
    commands:
      - waitForAnimationToEnd
      - tapOn: "More actions"
- extendedWaitUntil:
    visible: "Delete todo"
    timeout: 5000
- tapOn: "Delete todo"
- extendedWaitUntil:
    visible: ${output.del1}
    timeout: 5000
- tapOn: "Cancel"
- waitForAnimationToEnd
# Close via the sheet's handle. A tap that lands while the sheet is still
# settling is swallowed (nothing sticks — the next tap closes), so retry once.
- waitForAnimationToEnd
- tapOn: "Close"
- runFlow:
    when:
      visible: "Add notes…"
    commands:
      - waitForAnimationToEnd
      - tapOn: "Close"
- extendedWaitUntil:
    notVisible: "Add notes…"
    timeout: 8000
# Complete via swipe-right. The row's first left action is `autoCommit`. Kit
# < 0.4.0-alpha.2 mapped ReanimatedSwipeable's direction to the wrong panel
# (RNGH 2.28–2.31), so a full swipe only REVEALED the green "Done" panel
# (observed 2026-10-18); alpha.2 fixed the mapping. Keep accepting both
# outcomes: if the panel is still open, tap its button. "Done" index 0 is the
# segmented-control filter; the panel's button is the second "Done" on screen.
- swipe:
    from:
      text: ${output.todo}
    direction: RIGHT
    duration: 1000
- waitForAnimationToEnd
- runFlow:
    when:
      visible:
        text: "Done"
        index: 1
    commands:
      - tapOn:
          text: "Done"
          index: 1
      - waitForAnimationToEnd
# Done filter shows it (the native segmented control)
- tapOn:
    text: "Done"
    index: 0
- extendedWaitUntil:
    visible: ${output.todo}
    timeout: 10000
- tapOn:
    text: "All"
    index: 0
