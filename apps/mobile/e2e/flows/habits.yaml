# Create a habit, check it in, open its detail, edit today from the month
# grid's day sheet (undo, record again), come back.
appId: com.stageholder.meridian
name: habits
---
- runFlow: ../subflows/launch-signed-in.yaml
- evalScript: ${output.habit = 'JEVB E2E Habit ' + String(Date.now()).slice(-8)}
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB_LABEL: "Habits"
      TAB_ID: "tab-habits"
- tapOn:
    id: "fab-new-habit"
- extendedWaitUntil:
    visible: "e.g. Read for 30 minutes"
    timeout: 20000
- waitForAnimationToEnd
# A loaded emulator's Gboard drops/doubles keystrokes ("JBE2E Habit2317660"):
# verify what landed in the field and redo the entry until it matches (same
# guard as the Hub login form in subflows/sign-in.yaml).
- retry:
    maxRetries: 3
    commands:
      - tapOn: "e.g. Read for 30 minutes|${output.habit}|JEVB.*"
      - eraseText: 60
      - inputText: ${output.habit}
      - waitForAnimationToEnd
      - assertVisible: ${output.habit}
- tapOn: "Create New Habit"
# The sheet closes on success — wait for the row in the list, not the text
# still sitting in the sheet's input.
- extendedWaitUntil:
    notVisible: "e.g. Read for 30 minutes"
    timeout: 15000
- extendedWaitUntil:
    visible: ${output.habit}
    timeout: 15000
# Check in → the row flips to its undo state
- tapOn:
    text: "Check In|Complete"
    index: 0
- extendedWaitUntil:
    visible: "Undo last check-in|Undo"
    timeout: 10000
# Persisted: survives a relaunch
- runFlow: ../subflows/launch-signed-in.yaml
- runFlow:
    file: ../subflows/tab.yaml
    env:
      TAB_LABEL: "Habits"
      TAB_ID: "tab-habits"
- assertVisible: ${output.habit}
- assertVisible: "Undo last check-in|Undo"
# Detail is a pushed screen with a native header
- tapOn: ${output.habit}
- assertVisible: "Edit"
# Day sheet: tapping today on the month grid opens the day's actions as a
# sheet (2026-10-25; the old inline panel sat below the fold). Today is done
# from the check-in above → Undo; then Record again.
- evalScript: ${output.today = new Date().getFullYear() + '-' + String(new Date().getMonth() + 1).padStart(2, '0') + '-' + String(new Date().getDate()).padStart(2, '0')}
- scrollUntilVisible:
    element:
      id: ${'habit-day-' + output.today}
    direction: DOWN
    timeout: 20000
- tapOn:
    id: ${'habit-day-' + output.today}
- extendedWaitUntil:
    visible: "Done"
    timeout: 8000
- tapOn: "Undo"
# The sheet closes once the day is settled.
- extendedWaitUntil:
    notVisible: "Removes the last check-in for this day"
    timeout: 10000
- tapOn:
    id: ${'habit-day-' + output.today}
- extendedWaitUntil:
    visible: "Not recorded"
    timeout: 8000
- tapOn: "Record"
- extendedWaitUntil:
    notVisible: "Counts this day toward the habit"
    timeout: 10000
- runFlow: ../subflows/go-back.yaml
- assertVisible:
    id: "fab-new-habit"
