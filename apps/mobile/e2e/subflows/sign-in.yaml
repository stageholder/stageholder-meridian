# Hub sign-in through the system auth session (ASWebAuthenticationSession on
# iOS, Custom Tabs on Android). Credentials come from --env; never logged.
appId: com.stageholder.meridian
---
- tapOn: ".*Sign in with Stageholder.*"
# iOS asks before handing the auth session to the browser sheet.
- runFlow:
    when:
      visible: "Continue"
      platform: iOS
    commands:
      - tapOn: "Continue"
# A freshly cleared Chrome shows its first-run screens before the Custom Tab.
# They can take a few seconds to paint on a loaded emulator — a bare `when`
# evaluates immediately and skipped the handler while the screen was still
# loading, so first wait for whatever comes up (first-run, login page, or
# an already signed-in Today).
- extendedWaitUntil:
    visible: "(?i)(stay signed out|accept & continue|use without an account|no thanks)|Email address|Today"
    timeout: 45000
- runFlow:
    when:
      platform: Android
      visible: "(?i)(stay signed out|accept & continue|use without an account|no thanks)"
    commands:
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible: "(?i)(stay signed out|accept & continue|use without an account|no thanks)"
                commands:
                  - tapOn: "(?i)(stay signed out|accept & continue|use without an account|no thanks)"
                  - waitForAnimationToEnd
# A still-valid Hub session (SSO cookie) skips the login page entirely.
- extendedWaitUntil:
    visible: "Email address|Today"
    timeout: 45000
# Android Custom Tabs expose the inputs by their HTML id; iOS Safari exposes
# the placeholder text.
- runFlow:
    when:
      platform: Android
      visible: "Email address"
    commands:
      # A loaded emulator's keyboard can double keystrokes ("jejevb+…"), and
      # `eraseText` only deletes BEFORE the cursor, so retyping into a dirty
      # field just appends. Each attempt therefore closes the Custom Tab and
      # opens a FRESH login page (a Hub session from a half-successful
      # attempt is reused via SSO and lands on Today directly).
      - retry:
          maxRetries: 3
          commands:
            - runFlow:
                when:
                  visible: "Email address"
                commands:
                  - back
                  - extendedWaitUntil:
                      visible: ".*Sign in with Stageholder.*|Today"
                      timeout: 20000
            - runFlow:
                when:
                  visible: ".*Sign in with Stageholder.*"
                commands:
                  - tapOn: ".*Sign in with Stageholder.*"
                  - extendedWaitUntil:
                      visible: "Email address|Today"
                      timeout: 45000
            - runFlow:
                when:
                  visible: "Email address"
                commands:
                  - tapOn:
                      id: "email"
                  - inputText: ${E2E_EMAIL}
                  - assertVisible: ${E2E_EMAIL}
                  # Drop the keyboard before reaching for the password input:
                  # with it up, the input (and its label) sit UNDER the keys,
                  # the tap never reached them (and Tab just typed a space),
                  # focus stayed on the email field and the password was typed
                  # into it.
                  - hideKeyboard
                  - tapOn:
                      id: "password"
                  - inputText: ${E2E_PASSWORD}
                  # The email must still read exactly as typed; if the password
                  # landed in it, this fails and the retry opens a fresh page.
                  - assertVisible: ${E2E_EMAIL}
                  - pressKey: Enter
                  - extendedWaitUntil:
                      notVisible: "Email address"
                      timeout: 30000
- runFlow:
    when:
      platform: iOS
      visible: "Email address"
    commands:
      # Focus through the field LABELS (htmlFor): tapping the placeholder
      # text under a raised keyboard has landed keystrokes in the wrong
      # field. Verify the typed email and redo the entry until the Hub
      # accepts it (the login page goes away).
      - retry:
          maxRetries: 2
          commands:
            - tapOn:
                text: "Email address"
                index: 0
            - eraseText: 120
            - inputText: ${E2E_EMAIL}
            - assertVisible: ${E2E_EMAIL}
            - tapOn:
                text: "Password"
                index: 0
            - eraseText: 120
            - inputText: ${E2E_PASSWORD}
            # Submit with Enter — the page shows "Sign in" twice (heading + button).
            - pressKey: Enter
            - extendedWaitUntil:
                notVisible: "Email address"
                timeout: 30000
# First sign-in on a fresh Hub may show an OIDC consent screen.
- runFlow:
    when:
      visible: "(?i)^(allow|authorize|accept)$"
    commands:
      - tapOn: "(?i)^(allow|authorize|accept)$"
