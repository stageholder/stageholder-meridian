# Launch the app and make sure the test account is signed in and on Today.
# Keeps app state between flows (no clearState) so the session from the first
# flow is reused; signs in through the Hub only when needed.
appId: com.stageholder.meridian
# Metro the dev client connects to. Override with `-eMETRO_HOST=localhost:8082`
# (the runner passes flags through) to test against a second Metro while
# another one owns 8081.
env:
  METRO_HOST: "localhost:8081"
---
- evalScript: ${output.metroUrl = 'http://' + METRO_HOST}
- evalScript: ${output.metroLink = 'meridian://expo-development-client/?url=' + encodeURIComponent('http://' + METRO_HOST)}
- launchApp:
    appId: com.stageholder.meridian
    stopApp: true
# ALWAYS point the dev client at the configured Metro: a relaunched dev
# client silently reconnects to whatever it opened LAST (a `bun run ios`
# dev bundle on the LAN, 2026-10-25), so the flow ran against the wrong
# bundle without the launcher ever showing. The deep link reloads from
# METRO_HOST; iOS confirms it with an "Open in Meridian?" alert.
- openLink: ${output.metroLink}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn: "Open"
- launchApp:
    appId: com.stageholder.meridian
    stopApp: false
# A loaded emulator can raise an OS "isn't responding" dialog — wait it out.
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
# Wait for ANY known first screen before branching (a `when:` check right
# after launch runs before anything has rendered).
- extendedWaitUntil:
    visible:
      text: "Development Build|This is the developer menu.*|.*Sign in with Stageholder.*|Today|.*isn't responding"
    # A cold dev-client launch on a busy machine can take well over 45s.
    timeout: 120000
- runFlow:
    when:
      visible: ".*isn't responding"
    commands:
      - tapOn: "Wait"
# A cold-launched dev build opens Expo's launcher: connect to the local Metro.
- runFlow:
    when:
      visible: "Development Build"
    commands:
      - runFlow:
          when:
            visible: ${output.metroUrl}
          commands:
            - tapOn: ${output.metroUrl}
      # The launcher lists only servers it discovered or opened before. After a
      # `bun run ios` ("Recently opened" holds the LAN URL) or a fresh install
      # there is no localhost entry, so connect through the dev-client deep
      # link; iOS confirms it with an "Open in Meridian?" alert.
      - runFlow:
          when:
            notVisible: ${output.metroUrl}
          commands:
            - openLink: ${output.metroLink}
            - runFlow:
                when:
                  visible: "Open"
                commands:
                  - tapOn: "Open"
            # Opening the link can leave the app in the background (iOS lands
            # on the home screen) — bring it forward WITHOUT restarting; the
            # launcher now knows the Metro host and reconnects, or lists it.
            - launchApp:
                appId: com.stageholder.meridian
                stopApp: false
            - runFlow:
                when:
                  visible: ${output.metroUrl}
                commands:
                  - tapOn: ${output.metroUrl}
            # Metro may be building the bundle (cold cache: ~1 min).
            - extendedWaitUntil:
                visible:
                  text: "This is the developer menu.*|.*Sign in with Stageholder.*|Today"
                timeout: 120000
      - extendedWaitUntil:
          visible:
            text: "This is the developer menu.*|.*Sign in with Stageholder.*|Today"
          timeout: 90000
# Dev builds show Expo's developer-menu intro once per install…
- runFlow:
    when:
      visible: "This is the developer menu.*"
    commands:
      - tapOn: "Continue"
# …which leaves the developer menu itself open — close it.
- runFlow:
    when:
      visible: "Toggle performance monitor"
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - runFlow:
          when:
            platform: iOS
          commands:
            - swipe:
                direction: DOWN
- extendedWaitUntil:
    visible:
      text: ".*Sign in with Stageholder.*|Today"
    timeout: 45000
- runFlow:
    when:
      visible: ".*Sign in with Stageholder.*"
    file: sign-in.yaml
- extendedWaitUntil:
    visible:
      id: "today-greeting"
    timeout: 60000
