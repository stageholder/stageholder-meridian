<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Meridian — Personal Productivity</title>

    <!--
      Resolve the theme synchronously before first paint so the splash
      doesn't flash light-then-dark. This MIRRORS the resolution + class
      logic in src/lib/platform/theme.ts (the app's theme store), which
      re-applies the same classes the instant its module evaluates — this
      script only covers the window before the JS bundle runs. Keep the two
      in sync: same localStorage key ("theme"), same prefers-color-scheme
      fallback, same .dark/.light + colorScheme writes on <html>.
    -->
    <script>
      (function () {
        var resolved = "light";
        try {
          var stored = localStorage.getItem("theme");
          var prefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          resolved =
            stored === "dark" || stored === "light"
              ? stored
              : prefersDark
                ? "dark"
                : "light";
        } catch (e) {
          resolved = "light";
        }
        var root = document.documentElement;
        root.dataset.splashTheme = resolved;
        root.classList.toggle("dark", resolved === "dark");
        root.classList.toggle("light", resolved === "light");
        root.style.colorScheme = resolved;
      })();
    </script>

    <!--
      Initial-paint splash. Renders before Vite's main chunk downloads and
      stays mounted through React's first paint + auth probe. Structure mirrors
      the kit `LoadingScreen`: product logo → product title → progress → a
      "Powered by Stageholder" attribution. Clean and quiet — no chrome, no
      technical metadata. The JS at the bottom runs a decelerating progress
      curve and listens for `meridian:progress` / `meridian:ready` from React
      (via src/lib/loading-progress.ts).
    -->
    <style>
      :root {
        --splash-bg: oklch(0.99 0.004 60);
        --splash-fg: oklch(0.2 0.02 50);
        --splash-muted: oklch(0.56 0.02 50);
        --splash-border: oklch(0.92 0.008 60);
        --splash-primary: oklch(0.68 0.19 47);
        --splash-grid: oklch(0.2 0.02 50 / 0.05);
      }
      [data-splash-theme="dark"] {
        --splash-bg: oklch(0.15 0.01 50);
        --splash-fg: oklch(0.98 0.006 60);
        --splash-muted: oklch(0.7 0.02 60);
        --splash-border: oklch(0.98 0.006 60 / 0.12);
        --splash-primary: oklch(0.72 0.19 47);
        --splash-grid: oklch(0.98 0.006 60 / 0.06);
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--splash-bg);
        color: var(--splash-fg);
      }

      #meridian-splash {
        position: fixed;
        inset: 0;
        z-index: 2147483646;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: var(--splash-bg);
        color: var(--splash-fg);
        font-family:
          "Geist Variable", -apple-system, BlinkMacSystemFont, system-ui,
          "Segoe UI", Helvetica, Arial, sans-serif;
        opacity: 1;
        transition:
          opacity 520ms cubic-bezier(0.22, 1, 0.36, 1),
          visibility 0s linear 520ms;
        contain: layout style paint;
        overflow: hidden;
      }
      #meridian-splash[data-state="leaving"] {
        opacity: 0;
        visibility: hidden;
      }

      /* Dot grid with a center-weighted mask — quietly pulls focus to the
         mark without competing with it. */
      #meridian-splash::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image: radial-gradient(
          circle at 1px 1px,
          var(--splash-grid) 1px,
          transparent 0
        );
        background-size: 28px 28px;
        background-position: center center;
        mask-image: radial-gradient(
          ellipse at center,
          black 0%,
          black 50%,
          transparent 85%
        );
        -webkit-mask-image: radial-gradient(
          ellipse at center,
          black 0%,
          black 50%,
          transparent 85%
        );
        pointer-events: none;
      }
      /* Soft edge vignette so the canvas reads as a window, not a flat wall. */
      #meridian-splash::after {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at center,
          transparent 50%,
          color-mix(in oklch, var(--splash-bg), black 6%) 100%
        );
        pointer-events: none;
      }

      .splash-core {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 22px;
        animation: splash-rise 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes splash-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      /* PRODUCT identity — the Meridian mark (self-contained colour tile, one
         image for both themes). Mirrors the kit LoadingScreen `logo` slot. */
      .splash-mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
      }
      .splash-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
      }

      /* Product title under the mark — the kit LoadingScreen `title`. */
      .splash-title {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
        color: var(--splash-fg);
      }

      .splash-progress {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 10px;
        width: 220px;
      }
      .splash-track {
        position: relative;
        height: 6px;
        background: var(--splash-border);
        border-radius: 999px;
        overflow: hidden;
      }
      .splash-track .splash-fill {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0%;
        background: var(--splash-primary);
        border-radius: 999px;
        transition: width 240ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .splash-meta {
        display: flex;
        align-items: baseline;
        justify-content: center;
        font-size: 13px;
        color: var(--splash-muted);
        text-align: center;
      }
      .splash-meta .splash-message {
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        transition: opacity 240ms ease;
      }

      /* BRAND attribution — "Powered by Stageholder", pinned at the bottom,
         mirroring the kit LoadingScreen `poweredBy` row. */
      .splash-powered {
        position: absolute;
        bottom: 28px;
        left: 0;
        right: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 12px;
        color: var(--splash-muted);
      }
      .splash-powered img {
        width: 16px;
        height: 16px;
        border-radius: 4px;
        object-fit: contain;
      }
      .splash-powered strong {
        font-weight: 600;
        color: var(--splash-fg);
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-core {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body class="antialiased">
    <!--
      The splash lives outside #root so React never owns or unmounts it.
      The bootstrap script at the bottom runs the crawl, listens for
      meridian:progress / meridian:ready events from React (via
      `src/lib/loading-progress.ts`), and removes itself on completion.
    -->
    <div
      id="meridian-splash"
      role="status"
      aria-live="polite"
      aria-label="Loading Meridian"
    >
      <div class="splash-core">
        <div class="splash-mark" aria-hidden="true">
          <img
            src="/logo/meridian_mark.png"
            alt=""
            decoding="async"
            fetchpriority="high"
          />
        </div>

        <div class="splash-title">Meridian</div>

        <div class="splash-progress" aria-hidden="true">
          <div class="splash-track">
            <div class="splash-fill" data-splash-fill></div>
          </div>
          <div class="splash-meta">
            <span class="splash-message" data-splash-message
              >Initializing</span
            >
          </div>
        </div>
      </div>

      <div class="splash-powered" aria-hidden="true">
        <span>Powered by</span>
        <img src="/logo/stageholder-mark.png" alt="" decoding="async" />
        <strong>Stageholder</strong>
      </div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>

    <!--
      Splash runtime — owns the progress crawl, listens for React signals,
      tears down on `meridian:ready`. Vanilla JS so it runs immediately
      without waiting on the React bundle to download/parse.
    -->
    <script>
      (function () {
        var splash = document.getElementById("meridian-splash");
        if (!splash) return;

        // Skip the splash when we're about to bounce straight to the
        // identity hub for sign-in. We only have something to load when
        // (a) a session is already persisted in localStorage, or
        // (b) the URL carries `?code=` — we're returning from the hub and
        //     need to exchange the code. Otherwise React mounts, `_app`'s
        //     beforeLoad sees `isAuthenticated: false`, and the SDK's
        //     signIn() immediately redirects to the Hub. A multi-second
        //     progress bar in front of that redirect is just noise.
        try {
          var hasSession = !!window.localStorage.getItem(
            "stageholder:session:meridian",
          );
          var hasCode = /[?&]code=/.test(window.location.search);
          if (!hasSession && !hasCode) {
            if (splash.parentNode) splash.parentNode.removeChild(splash);
            return;
          }
        } catch (e) {
          // localStorage may throw in private mode / sandboxed iframes —
          // fall through and let the splash run as before.
        }

        var fillEl = splash.querySelector("[data-splash-fill]");
        var messageEl = splash.querySelector("[data-splash-message]");

        var current = 0;
        var target = 8;
        var done = false;

        var phases = [
          { at: 0, label: "Initializing" },
          { at: 22, label: "Loading interface" },
          { at: 52, label: "Restoring session" },
          { at: 78, label: "Preparing workspace" },
          { at: 96, label: "Almost ready" },
        ];
        var phaseIndex = -1;

        function setMessage(text) {
          if (!messageEl || messageEl.textContent === text) return;
          messageEl.style.opacity = "0";
          setTimeout(function () {
            messageEl.textContent = text;
            messageEl.style.opacity = "1";
          }, 180);
        }

        function render() {
          if (fillEl) fillEl.style.width = current.toFixed(1) + "%";
          for (var i = phases.length - 1; i >= 0; i--) {
            if (current >= phases[i].at && phaseIndex < i) {
              phaseIndex = i;
              setMessage(phases[i].label);
              break;
            }
          }
        }

        var lastTs = performance.now();
        function tick(ts) {
          if (done) return;
          var dt = Math.min((ts - lastTs) / 1000, 0.1);
          lastTs = ts;
          // Decelerating crawl toward 92% so the bar feels alive without ever
          // reaching completion before React signals ready.
          var ceiling = 92;
          var remaining = Math.max(0, ceiling - current);
          var speed = Math.max(2, remaining * 0.9);
          current = Math.min(ceiling, current + speed * dt);
          if (current < target) current = target;
          render();
          requestAnimationFrame(tick);
        }

        function bump(to, message) {
          target = Math.max(target, Math.min(to, 92));
          if (message) setMessage(message);
        }

        // Resource-load nudges — each chunk that lands bumps the floor up so
        // the bar tracks actual asset loading rather than pure time.
        try {
          if (typeof PerformanceObserver !== "undefined") {
            var po = new PerformanceObserver(function (list) {
              var loaded = list.getEntries().length;
              target = Math.min(92, target + Math.min(4, loaded * 1.5));
            });
            po.observe({ type: "resource", buffered: true });
            setTimeout(function () {
              try {
                po.disconnect();
              } catch (e) {}
            }, 15000);
          }
        } catch (e) {}

        function finish() {
          if (done) return;
          done = true;
          current = 100;
          if (fillEl) fillEl.style.width = "100%";
          setMessage("Ready");
          // Hold briefly at 100 so users notice the completion, then fade out
          // (CSS handles the transition); remove from DOM after the fade.
          setTimeout(function () {
            splash.dataset.state = "leaving";
            setTimeout(function () {
              if (splash.parentNode) splash.parentNode.removeChild(splash);
            }, 600);
          }, 220);
        }

        window.addEventListener("meridian:progress", function (e) {
          var detail = (e && e.detail) || {};
          if (typeof detail.value === "number") bump(detail.value, detail.label);
          else if (detail.label) setMessage(detail.label);
        });
        window.addEventListener("meridian:ready", finish);

        // Safety net — never let the splash hang forever if a signal is
        // missed in dev or behind a proxy.
        setTimeout(function () {
          if (!done) finish();
        }, 20000);

        document.addEventListener("DOMContentLoaded", function () {
          bump(28);
        });
        window.addEventListener("load", function () {
          bump(48);
        });

        requestAnimationFrame(tick);
      })();
    </script>
  </body>
</html>
